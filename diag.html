<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Push Diag</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="PushDiag" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0A0F1D" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="manifest" href="./diag.webmanifest" />
<style>
  body { background:#0A0F1D; color:#fff; font-family:-apple-system, Arial; padding:20px; font-size:19px; line-height:1.75; }
  b { color:#F5C518; }
  button { font-size:19px; padding:14px 20px; border-radius:12px; border:1.5px solid #F5C518; background:#101828; color:#fff; margin:10px 0; }
  .small { font-size:14px; color:#9fb3c8; word-break:break-all; }
</style>
</head>
<body>
<div id="out">Running checks...</div>
<button id="perm">1. Request notification permission</button><br/>
<button id="sw">2. Register service worker</button><br/>
<button id="tok">3. Get FCM token (full registration)</button>
<div id="res"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script>
function yn(v){ return v ? 'YES' : 'NO'; }
var lines = [];
lines.push('Notification in window: <b>' + yn('Notification' in window) + '</b>');
lines.push('PushManager in window: <b>' + yn('PushManager' in window) + '</b>');
lines.push('serviceWorker in navigator: <b>' + yn('serviceWorker' in navigator) + '</b>');
lines.push('navigator.standalone: <b>' + String(navigator.standalone) + '</b>');
lines.push('display-mode standalone: <b>' + yn(window.matchMedia('(display-mode: standalone)').matches) + '</b>');
if ('Notification' in window) lines.push('Notification.permission: <b>' + Notification.permission + '</b>');
document.getElementById('out').innerHTML = lines.join('<br/>') + '<br/><span class="small">' + navigator.userAgent + '</span>';
document.getElementById('perm').onclick = async function(){
  var r = document.getElementById('res');
  try {
    var p = await Notification.requestPermission();
    r.innerHTML = 'requestPermission result: <b>' + p + '</b>';
  } catch(e){ r.innerHTML = 'requestPermission error: <b>' + e.message + '</b>'; }
};
document.getElementById('sw').onclick = async function(){
  var r = document.getElementById('res');
  try {
    var reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    r.innerHTML = 'SW registered: <b>' + (reg ? 'YES' : 'NO') + '</b> scope: ' + (reg && reg.scope);
  } catch(e){ r.innerHTML = 'SW register error: <b>' + e.message + '</b>'; }
};
document.getElementById('tok').onclick = async function(){
  var r = document.getElementById('res');
  r.innerHTML = 'Working... (up to 30s)';
  var started = Date.now();
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp({
        apiKey: 'AIzaSyAZKtpIGgxc9qHRdQJJkVyYpSpxo4CUP5U',
        authDomain: 'us-civic-test-beta.firebaseapp.com',
        projectId: 'us-civic-test-beta',
        storageBucket: 'us-civic-test-beta.firebasestorage.app',
        messagingSenderId: '932562474530',
        appId: '1:932562474530:web:5d05141b3d8ad6ccc7dc7b'
      });
    }
    var reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    var messaging = firebase.messaging();
    var token = await Promise.race([
      messaging.getToken({ vapidKey: 'BFPVJ7pqEFWgOfCXm2aNRyGuov1mOT161vjVM-rD7jXShqX7e9ZZEXMO-98qsP94Gnnx0Zl-7c-mr4LhLSp4reI', serviceWorkerRegistration: reg }),
      new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('getToken HUNG over 30s')); }, 30000); })
    ]);
    var secs = Math.round((Date.now() - started) / 1000);
    if (token) {
      r.innerHTML = 'TOKEN OK in ' + secs + 's: <b>' + token.slice(0, 25) + '...</b> (len ' + token.length + ')';
    } else {
      r.innerHTML = 'getToken returned EMPTY after ' + secs + 's';
    }
  } catch(e) {
    r.innerHTML = 'getToken ERROR: <b>' + (e.code || '') + ' ' + e.message + '</b>';
  }
};
</script>
</body>
</html>
